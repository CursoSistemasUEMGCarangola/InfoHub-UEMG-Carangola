<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="60%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#004d99"/>
    </linearGradient>
  </defs>
  <!-- Fundo com cantos arredondados (compatível com Maskable) -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Linha de detalhe institucional vermelho UEMG -->
  <rect x="64" y="440" width="384" height="12" rx="6" fill="#d32f2f"/>

  <!-- Letra / Marca Central UEMG Estilizada -->
  <g fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Ícone Institucional Acima do Texto -->
    <path d="M256 110 L350 165 L350 200 L162 200 L162 165 Z" fill="#ffffff"/>
    <rect x="180" y="210" width="24" height="75" rx="4" fill="#ffffff"/>
    <rect x="244" y="210" width="24" height="75" rx="4" fill="#ffffff"/>
    <rect x="308" y="210" width="24" height="75" rx="4" fill="#ffffff"/>
    <rect x="150" y="295" width="212" height="18" rx="4" fill="#ffffff"/>
    
    <!-- Tipografia InfoHub & Carangola -->
    <text x="256" y="365" font-size="44" font-weight="900" letter-spacing="2">INFOHUB</text>
    <text x="256" y="405" font-size="22" font-weight="700" fill="#e0f2fe" letter-spacing="4">CARANGOLA</text>
  </g>
</svg>
